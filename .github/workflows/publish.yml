name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - name: 运行完整发布检查
        run: pnpm pack:check

      - name: 确认标签与包版本一致
        if: github.event_name == 'push'
        run: node scripts/check-release-tag.mjs

      - name: 生成待发布的包
        run: node scripts/pack-release.mjs

      # pnpm 负责在打包阶段改写 workspace:*；npm 负责上传，沿用本仓库已经验证过的 OIDC 发布路径。
      - name: 发布 mn-rails
        if: github.event_name == 'push'
        run: npm publish "$PWD/release/mn-rails.tgz" --access public --provenance

      - name: 等待 mn-rails 对注册表可见
        if: github.event_name == 'push'
        run: node scripts/wait-for-release.mjs mn-rails

      - name: 发布 create-mn-rails
        if: github.event_name == 'push'
        run: npm publish "$PWD/release/create-mn-rails.tgz" --access public --provenance

      - name: 等待 create-mn-rails 对注册表可见
        if: github.event_name == 'push'
        run: node scripts/wait-for-release.mjs create-mn-rails

      - name: 发布 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$PWD/release/mn-rails.tgz" \
              "$PWD/release/create-mn-rails.tgz" \
              "$PWD/release/manifest.json" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PWD/release/mn-rails.tgz" \
              "$PWD/release/create-mn-rails.tgz" \
              "$PWD/release/manifest.json" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: 输出发布摘要
        run: node scripts/release-summary.mjs
